name: release

# A version bump merged to main is a release: tag vX.Y.Z + GitHub Release with that version's CHANGELOG section.
# Talks pick it up with `npm run upgrade` (newest tag).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tag and release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists, nothing to release"
            exit 0
          fi
          node scripts/changelog-section.mjs "${version}" > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "beatdeck ${version}"
          git push origin "${tag}"
          gh release create "${tag}" --title "beatdeck ${version}" --notes-file notes.md --verify-tag
